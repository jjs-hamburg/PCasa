<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map { margin:0; height:100%; width:100%; overflow:hidden; }
body{font-family:Segoe UI,sans-serif;background:#dfded9}
.maplibregl-popup-content{font-size:12px;line-height:1.5;max-width:260px;overflow-wrap:anywhere;color:#222}
.maplibregl-ctrl-attrib{font-size:10px}
#fallback{position:absolute;left:12px;right:12px;top:42%;color:#333;text-align:center;pointer-events:none}
.pcasa-pin{width:17px;height:17px;box-sizing:border-box;background:#df4550;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px #222b;cursor:pointer}
.pcasa-pin-target{width:24px;height:24px;background:#f0a030;border:3px solid #111;outline:2px solid #fff;outline-offset:0}
.pcasa-pin-target:before{content:'';display:block;width:7px;height:7px;background:#fff;border-radius:50%;margin:5.5px auto 0}
</style></head><body><div id="map"></div><div id="fallback"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"
 onerror="document.getElementById('fallback').textContent='MapLibre konnte nicht geladen werden.'"></script>
<script>
(() => {
 'use strict';
 const post = (data) => { if (window.CefSharp?.PostMessage) CefSharp.PostMessage(JSON.stringify(data)); };
 if (!window.maplibregl) { post({type:'error',message:'MapLibre library unavailable'}); return; }
 const fallback = document.getElementById('fallback');
 const empty = { type:'FeatureCollection',features:[] };
 const map = new maplibregl.Map({
   // Start without a network-dependent style; the WPF provider owner
   // supplies the chosen style after the renderer reports readiness.
   container:'map',style:{version:8,sources:{},layers:[]},
   // Keep the required licensing attribution accessible via the small
   // information button, instead of an expanded overlay obscuring photos.
   center:[10,42],zoom:2,attributionControl:{compact:true}
 });
 map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
 // MapLibre 5.9's compact attribution starts EXPANDED until the first drag.
 // Open the photo map in the compact state from the first frame, but keep
 // the information button and the complete source credits available.
 let initialAttributionCollapsePending = true;
 function collapseAttributionInitially() {
   if (!initialAttributionCollapsePending) return;
   const attribution = map.getContainer().querySelector('.maplibregl-ctrl-attrib.maplibregl-compact');
   // The starting style is deliberately empty. Attribution for the chosen
   // provider may arrive later as source metadata, not at 'style.load'.
   if (!attribution || attribution.classList.contains('maplibregl-attrib-empty')) return;
   attribution.classList.remove('maplibregl-compact-show');
   attribution.removeAttribute('open');
   initialAttributionCollapsePending = false;
 }
 collapseAttributionInitially();
 map.on('styledata', collapseAttributionInitially);
 map.on('sourcedata', collapseAttributionInitially);
 let points = [], ready = false, highlightedId = null;
 let previousSelectedIds = null;
 const selectedMarkers = new Map();
 function geojson(list) {
   return {type:'FeatureCollection',features:list.map(p=>({
     type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},
     properties:{id:String(p.id),name:p.name||''}
   }))};
 }
 function installPhotos() {
   // 'style.load' fires before map.isStyleLoaded() necessarily returns true.
   // That previous guard skipped source installation after provider switches.
   if (!map.getSource('pcasa-photos')) {
     map.addSource('pcasa-photos',{type:'geojson',data:geojson([]),
       cluster:true,clusterRadius:46,clusterMaxZoom:15});
     map.addLayer({id:'pcasa-clusters',type:'circle',source:'pcasa-photos',filter:['has','point_count'],
       paint:{'circle-color':'#345e88','circle-radius':['step',['get','point_count'],17,20,21,100,27],
              'circle-stroke-width':2.5,'circle-stroke-color':'#fff'}});
     map.addLayer({id:'pcasa-cluster-count',type:'symbol',source:'pcasa-photos',filter:['has','point_count'],
       layout:{'text-field':['get','point_count_abbreviated'],'text-size':13},
       paint:{'text-color':'#fff'}});
     map.addLayer({id:'pcasa-points',type:'circle',source:'pcasa-photos',filter:['!',['has','point_count']],
       paint:{'circle-radius':8,'circle-color':'#df4550',
              'circle-stroke-width':2.3,'circle-stroke-color':'#fff'}});
   }
   // Selected photos have their own unclustered source and are always on top.
   // A cluster at identical coordinates must never swallow the selected marker.
   if (!map.getSource('pcasa-selected')) {
     map.addSource('pcasa-selected',{type:'geojson',data:geojson([])});
     map.addLayer({id:'pcasa-selected-points',type:'circle',source:'pcasa-selected',
       paint:{'circle-radius':12,'circle-color':'#f0a030',
              'circle-stroke-width':4,'circle-stroke-color':'#111'}});
     map.addLayer({id:'pcasa-selected-center',type:'circle',source:'pcasa-selected',
       paint:{'circle-radius':5,'circle-color':'#fff'}});
   }
   updatePhotos();
 }
 function updatePhotos() {
   map.getSource('pcasa-photos')?.setData(geojson(points.filter(p=>!p.selected)));
   map.getSource('pcasa-selected')?.setData(geojson(points.filter(p=>p.selected)));
   syncSelectedMarkers();
 }
 function syncSelectedMarkers() {
   // Guaranteed visible regardless of style-load races, tile/label order or
   // clustering. Capped overlay count; the vector source still covers ALL
   // selected pictures, even for huge selections.
   const selected = points.filter(p=>p.selected);
   if (selected.length && !selected.some(p=>String(p.id)===String(highlightedId)))
     highlightedId=String(selected[0].id);
   const keep = new Set();
   for (const p of selected.slice(0,200)) {
     const key = String(p.id); keep.add(key);
     let entry=selectedMarkers.get(key);
     if (!entry) {
       const el=document.createElement('div');
       el.className='pcasa-pin';
       el.title=p.name||'Foto';
       el.addEventListener('click',e=>{
         e.stopPropagation();
         post({type:'select',id:Number(key)});
       });
       const marker=new maplibregl.Marker({element:el,anchor:'center'})
         .setLngLat([p.lon,p.lat]).addTo(map);
       entry={marker,el}; selectedMarkers.set(key,entry);
     } else entry.marker.setLngLat([p.lon,p.lat]);
     const highlighted = key===String(highlightedId);
     entry.el.classList.toggle('pcasa-pin-target',highlighted);
     // Photos may share identical GPS coordinates. The highlighted one
     // must render above the others instead of hiding behind the last pin.
     entry.el.style.zIndex = highlighted ? '99' : '1';
   }
   for(const [key,entry] of selectedMarkers)
     if(!keep.has(key)){entry.marker.remove();selectedMarkers.delete(key);}
 }
 window.pcasaHighlightPoint = (id) => {
   const p=points.find(p=>String(p.id)===String(id) && p.selected);
   if(!p)return;
   highlightedId=String(id);
   // Highlight only: the user must retain the exact map extent while
   // comparing selected photos, even at identical GPS coordinates.
   syncSelectedMarkers();
 };
 function zoomSelection() {
   const selected = points.filter(p=>p.selected);
   const target = selected.length ? selected : points;
   if (!target.length) return;
   if (target.length===1) { map.easeTo({center:[target[0].lon,target[0].lat],zoom:13,duration:450}); return; }
   const bounds = new maplibregl.LngLatBounds();
   for(const p of target) bounds.extend([p.lon,p.lat]);
   map.fitBounds(bounds,{padding:35,maxZoom:13,duration:400});
 }
 window.pcasaSetPoints = (data) => {
   points = Array.isArray(data) ? data.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)) : [];
   const selectedIds = points.filter(p=>p.selected).map(p=>String(p.id)).sort().join(',');
   const selectionChanged = selectedIds !== previousSelectedIds;
   previousSelectedIds = selectedIds;
   if (ready) {
     updatePhotos();
     // Only a different multi-photo selection establishes a new overview.
     // A focus/highlight update must NEVER pan or zoom this overview.
     if (selectionChanged && selectedIds) zoomSelection();
   }
 };
 window.pcasaApplyProvider = (provider) => {
   if (!provider || !provider.url) return;
   try {
     const style=provider.format==='xyz'
       ? {version:8,sources:{basemap:{type:'raster',tiles:[provider.url],tileSize:256,attribution:provider.attribution||''}},
          layers:[{id:'basemap',type:'raster',source:'basemap'}]}
       : provider.url;
     map.setStyle(style);
   } catch(err) { post({type:'error',message:String(err)}); }
 };
 map.on('style.load',()=>{
   installPhotos();
   if(!ready){ready=true;post({type:'ready'});}
   // Style switching preserves the current camera instead of zooming again.
 });
 map.on('error',event=>{const s=String(event.error?.message||'');if(s)post({type:'error',message:s.substring(0,250)});});
 map.on('click','pcasa-clusters',event=>{
   const features=map.queryRenderedFeatures(event.point,{layers:['pcasa-clusters']});
   if(!features.length) return;
   const id=features[0].properties.cluster_id;
   map.getSource('pcasa-photos').getClusterExpansionZoom(id).then(
     zoom=>map.easeTo({center:features[0].geometry.coordinates,zoom})
   ).catch(()=>{});
 });
 function selectPhoto(event) {
   if(!event.features?.length) return;
   const id=Number(event.features[0].properties.id);
   if(Number.isSafeInteger(id)) post({type:'select',id});
 }
 map.on('click','pcasa-points',selectPhoto);
 map.on('click','pcasa-selected-points',selectPhoto);
 for(const layer of ['pcasa-points','pcasa-selected-points']) {
   map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');
   map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='');
 }
 map.on('mouseenter','pcasa-clusters',()=>map.getCanvas().style.cursor='pointer');
 map.on('mouseleave','pcasa-clusters',()=>map.getCanvas().style.cursor='');
 let draftMarker = null;
 let placementEnabled = false;
 function placeDraft(lat,lon,recenter) {
   if (!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return;
   if (!draftMarker) {
     const el=document.createElement('div');
     el.title='GPS-Position – ziehen, um sie zu korrigieren';
     el.style.cssText='width:21px;height:21px;background:#f8d573;border:3px solid #101010;outline:2px solid white;border-radius:2px;transform:rotate(45deg);box-sizing:border-box;cursor:move';
     draftMarker=new maplibregl.Marker({element:el,draggable:true,anchor:'center'})
       .setLngLat([lon,lat]).addTo(map);
     draftMarker.on('dragend',()=>{
       const p=draftMarker.getLngLat();
       post({type:'draft',lat:p.lat,lon:p.lng});
     });
   } else draftMarker.setLngLat([lon,lat]);
   if (recenter) map.easeTo({center:[lon,lat],zoom:Math.max(map.getZoom(),14),duration:450});
 }
 window.pcasaSetDraft = placeDraft;
 window.pcasaClearDraft = () => {
   placementEnabled = false;
   if (draftMarker) { draftMarker.remove(); draftMarker = null; }
   map.getCanvas().style.cursor = '';
 };
 window.pcasaEnablePlacement = enabled => {
   placementEnabled=!!enabled;
   map.getCanvas().style.cursor=placementEnabled ? 'crosshair' : '';
 };
 map.on('click',event=>{
   if (!placementEnabled) return;
   const ids=['pcasa-points','pcasa-selected-points','pcasa-clusters']
     .filter(id=>!!map.getLayer(id));
   if (ids.length && map.queryRenderedFeatures(event.point,{layers:ids}).length) return;
   const lat=event.lngLat.lat,lon=event.lngLat.lng;
   placeDraft(lat,lon,false);
   post({type:'draft',lat,lon});
 });
 window.pcasaReadBounds = () => {
   const b=map.getBounds();
   post({type:'bounds',south:b.getSouth(),west:Math.max(-180,b.getWest()),
     north:b.getNorth(),east:Math.min(180,b.getEast())});
 };
 window.pcasaRestoreViewport = (lat,lon,zoom) => {
   if(Number.isFinite(lat)&&Number.isFinite(lon)&&Number.isFinite(zoom))
     map.jumpTo({center:[lon,lat],zoom});
 };
 map.on('moveend',()=>{
   const p=map.getCenter();
   post({type:'viewport',lat:p.lat,lon:p.lng,zoom:map.getZoom()});
 });
 window.pcasaResize = () => map.resize();
 map.on('load',()=>{fallback.remove();});
})();
</script></body></html>
