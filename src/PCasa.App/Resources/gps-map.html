<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map { margin:0; height:100%; width:100%; overflow:hidden; }
body{font-family:Segoe UI,sans-serif;background:#dfded9}
.maplibregl-popup-content{font-size:12px;line-height:1.5;max-width:260px;overflow-wrap:anywhere;color:#222}
.maplibregl-ctrl-attrib{font-size:10px}
#fallback{position:absolute;left:12px;right:12px;top:42%;color:#333;text-align:center;pointer-events:none}
.pcasa-pin{width:17px;height:17px;box-sizing:border-box;background:#df4550;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px #222b;cursor:pointer}
.pcasa-pin-target{width:24px;height:24px;background:#f0a030;border:3px solid #111;outline:2px solid #fff;outline-offset:0}
.pcasa-pin-target:before{content:'';display:block;width:7px;height:7px;background:#fff;border-radius:50%;margin:5.5px auto 0}
.pcasa-pin-count{display:flex;align-items:center;justify-content:center;width:27px;height:27px;background:#f0a030;border:3px solid #111;color:#111;font:bold 11px Segoe UI,sans-serif}
</style></head><body><div id="map"></div><div id="fallback"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"
 onerror="document.getElementById('fallback').textContent='MapLibre konnte nicht geladen werden.'"></script>
<script>
(() => {
 'use strict';
 const post = (data) => { if (window.CefSharp?.PostMessage) window.CefSharp.PostMessage(JSON.stringify(data)); };
 if (!window.maplibregl) { post({type:'error',message:'MapLibre library unavailable'}); return; }
 const fallback = document.getElementById('fallback');
 const empty = { type:'FeatureCollection',features:[] };
 const map = new maplibregl.Map({
   // Start without a network-dependent style; the WPF provider owner
   // supplies the chosen style after the renderer reports readiness.
   container:'map',style:{version:8,sources:{},layers:[]},
   // Keep the required licensing attribution accessible via the small
   // information button, instead of an expanded overlay obscuring photos.
   center:[10,42],zoom:2,attributionControl:{compact:true}
 });
 map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
 // MapLibre 5.9's compact attribution starts EXPANDED until the first drag.
 // Open the photo map in the compact state from the first frame, but keep
 // the information button and the complete source credits available.
 let initialAttributionCollapsePending = true;
 function collapseAttributionInitially() {
   if (!initialAttributionCollapsePending) return;
   const attribution = map.getContainer().querySelector('.maplibregl-ctrl-attrib.maplibregl-compact');
   // The starting style is deliberately empty. Attribution for the chosen
   // provider may arrive later as source metadata, not at 'style.load'.
   if (!attribution || attribution.classList.contains('maplibregl-attrib-empty')) return;
   attribution.classList.remove('maplibregl-compact-show');
   attribution.removeAttribute('open');
   initialAttributionCollapsePending = false;
 }
 collapseAttributionInitially();
 map.on('styledata', collapseAttributionInitially);
 map.on('sourcedata', collapseAttributionInitially);
 let points = [], ready = false, highlightedId = null;
 const selectedMarkers=new Map();
 let visibleSelectedGroups=[];
 let previousSelectedSignature = null;
 let transferRevision=-1,transferParts=[],transferExpected=0,
     transferActive=false,transferCommitRequested=false;
 // Diagnose only a completely blank large selected overlay, once per
 // transferred selection and basemap style; never log every camera frame.
 let styleGeneration=0,lastOverlayCheck='';

 function geojson(list) {
   return {type:'FeatureCollection',features:list.map(p=>({
     type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},
     properties:{id:String(p.id),name:p.name||''}
   }))};
 }
 function installPhotos() {
   // 'style.load' fires before map.isStyleLoaded() necessarily returns true.
   // That previous guard skipped source installation after provider switches.
   if (!map.getSource('pcasa-photos')) {
     map.addSource('pcasa-photos',{type:'geojson',data:geojson([]),
       cluster:true,clusterRadius:46,clusterMaxZoom:15});
     map.addLayer({id:'pcasa-clusters',type:'circle',source:'pcasa-photos',filter:['has','point_count'],
       paint:{'circle-color':'#345e88','circle-radius':['step',['get','point_count'],17,20,21,100,27],
              'circle-stroke-width':2.5,'circle-stroke-color':'#fff'}});
     map.addLayer({id:'pcasa-cluster-count',type:'symbol',source:'pcasa-photos',filter:['has','point_count'],
       layout:{'text-field':['get','point_count_abbreviated'],'text-size':13},
       paint:{'text-color':'#fff'}});
     map.addLayer({id:'pcasa-points',type:'circle',source:'pcasa-photos',filter:['!',['has','point_count']],
       paint:{'circle-radius':8,'circle-color':'#df4550',
              'circle-stroke-width':2.3,'circle-stroke-color':'#fff'}});
   }
   updatePhotos();
 }
 // There is ONE selected-photo presentation path, regardless of selection
 // size. Map providers supply only the basemap. PCasa builds real geographic
 // groups before creating map markers: no pixel grids, collision displacement,
 // WebGL source-worker dependence, or exact-match-only grouping.
 // This also avoids the blank >7,000-photo GeoJSON overlay seen in Chromium.
 const EARTH_KM=6371.0088,TO_RAD=Math.PI/180;
 function distanceKm(a,b) {
   const lat1=a.lat*TO_RAD,lat2=b.lat*TO_RAD;
   const dlat=(b.lat-a.lat)*TO_RAD;
   const dlon=(((b.lon-a.lon+540)%360)-180)*TO_RAD;
   const h=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;
   return 2*EARTH_KM*Math.asin(Math.min(1,Math.sqrt(h)));
 }
 function groupingRadiusKm(zoom) {
   // 280 km at zoom 2, 17 m at zoom 16, about 1 m at zoom 20.
   // A fixed geographical distance at every zoom is NOT sensible: the
   // range halves for each map zoom step independently of the tile provider.
   return Math.max(0.001,280*Math.pow(2,2-Math.max(0,zoom)));
 }
 function selectedLocations(selected) {
   const locations=new Map();
   for(const p of selected) {
     if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))continue;
     const key=JSON.stringify([p.lon,p.lat]);
     let g=locations.get(key);
     if(!g) {g={id:p.id,lat:p.lat,lon:p.lon,count:0,highlighted:false};
       locations.set(key,g);}
     g.count++;
     if(String(p.id)===String(highlightedId))g.highlighted=true;
   }
   return [...locations.values()];
 }
 function geographicGroups(locations,radiusKm) {
   // Geographic latitude buckets are ONLY a search acceleration structure;
   // they do not determine display positions or whether photos are grouped.
   // Every membership decision uses a real great-circle distance in km.
   const sorted=[...locations].sort((a,b)=>a.lat-b.lat||a.lon-b.lon||
     Number(a.id)-Number(b.id));
   const bandSize=Math.max(radiusKm/111.2,0.000005);
   const bands=new Map(),groups=[];
   for(const photo of sorted) {
     const band=Math.floor((photo.lat+90)/bandSize);
     let winner=null,nearest=radiusKm;
     // Centers may move within one radius of their seed. Search adjacent
     // latitude bands generously; no artificial longitude stripes.
     for(let near=band-4;near<=band+4;near++) {
       for(const g of bands.get(near)||[]) {
         if(Math.abs(g.lat-photo.lat)*110.5>radiusKm)continue;
         const km=distanceKm(g,photo);
         if(km<=nearest){winner=g;nearest=km;}
       }
     }
     if(!winner) {
       const lonRadians=photo.lon*TO_RAD;
       winner={id:photo.id,lat:photo.lat,lon:photo.lon,
         originalLat:photo.lat,originalLon:photo.lon,count:0,
         sumLat:0,sumSin:0,sumCos:0,highlighted:false,exact:true};
       groups.push(winner);
       if(!bands.has(band))bands.set(band,[]);
       bands.get(band).push(winner);
     }
     winner.exact=winner.exact &&
       photo.lat===winner.originalLat && photo.lon===winner.originalLon;
     winner.count+=photo.count;
     winner.sumLat+=photo.lat*photo.count;
     winner.sumSin+=Math.sin(photo.lon*TO_RAD)*photo.count;
     winner.sumCos+=Math.cos(photo.lon*TO_RAD)*photo.count;
     winner.lat=winner.sumLat/winner.count;
     winner.lon=Math.atan2(winner.sumSin,winner.sumCos)/TO_RAD;
     winner.highlighted ||= photo.highlighted;
   }
   return groups;
 }
 function inViewport(p) {
   const b=map.getBounds?.();
   if(!b)return true;
   const south=b.getSouth(),north=b.getNorth(),west=b.getWest(),east=b.getEast();
   const padLat=Math.max(0.005,(north-south)*0.08);
   const padLon=Math.max(0.005,(east-west)*0.08);
   if(p.lat<south-padLat||p.lat>north+padLat)return false;
   return [p.lon,p.lon-360,p.lon+360].some(lon=>
     lon>=west-padLon&&lon<=east+padLon);
 }
 function drawSelected() {
   const selected=points.filter(p=>p.selected);
   const locations=selectedLocations(selected);
   const groups=geographicGroups(locations,groupingRadiusKm(map.getZoom()));
   visibleSelectedGroups=groups.filter(inViewport);
   const keep=new Set();
   for(const group of visibleSelectedGroups) {
     const key=String(group.id);keep.add(key);
     let entry=selectedMarkers.get(key);
     if(!entry) {
       const el=document.createElement('div');
       el.style.pointerEvents='none';
       const marker=new maplibregl.Marker({element:el,anchor:'center'})
         .setLngLat([group.lon,group.lat]).addTo(map);
       entry={marker,el};selectedMarkers.set(key,entry);
     } else entry.marker.setLngLat([group.lon,group.lat]);
     const isGroup=group.count>1;
     entry.el.className=isGroup?'pcasa-pin pcasa-pin-count':
       group.highlighted?'pcasa-pin pcasa-pin-target':'pcasa-pin';
     entry.el.textContent=isGroup?String(group.count):'';
     entry.el.style.zIndex=group.highlighted?'6':'5';
   }
   for(const [key,entry] of selectedMarkers)
     if(!keep.has(key)){entry.marker.remove();selectedMarkers.delete(key);}
 }
 function selectVisibleGroup(event) {
   // The DOM pins have pointer-events disabled, leaving map clicks and
   // placement controls on the original map canvas. Hit testing uses
   // projected REAL geographic centers, never a placement-adjusted row.
   let nearest=null,best=22*22;
   for(const group of visibleSelectedGroups) {
     const screen=map.project([group.lon,group.lat]);
     const dx=screen.x-event.point.x,dy=screen.y-event.point.y;
     const distance=dx*dx+dy*dy;
     if(distance<best){nearest=group;best=distance;}
   }
   if(!nearest)return false;
   if(nearest.count>1&&!nearest.exact) {
     map.easeTo({center:[nearest.lon,nearest.lat],
       zoom:Math.min(23,Math.max(map.getZoom()+2,3)),duration:350});
   } else if(nearest.count>1)
     post({type:'point-group',id:Number(nearest.id),
       south:nearest.originalLat,north:nearest.originalLat,
       west:nearest.originalLon,east:nearest.originalLon});
   else post({type:'select',id:Number(nearest.id)});
   return true;
 }
 function updatePhotos() {
   map.getSource('pcasa-photos')?.setData(geojson(points.filter(p=>!p.selected)));
   const selected=points.filter(p=>p.selected);
   if(selected.length&&!selected.some(p=>String(p.id)===String(highlightedId)))
     highlightedId=String(selected[0].id);
   if(!selected.length)highlightedId=null;
   drawSelected();
 }
 window.pcasaHighlightPoint = id => {
   if(!points.some(p=>String(p.id)===String(id)&&p.selected))return;
   highlightedId=String(id);
   // Changing the highlighted photo never pans/zooms or changes selection.
   drawSelected();
 };
 function zoomSelection() {
   const selected = points.filter(p=>p.selected);
   const target = selected.length ? selected : points;
   if (!target.length) return;
   if (target.length===1) { map.easeTo({center:[target[0].lon,target[0].lat],zoom:13,duration:450}); return; }
   const bounds = new maplibregl.LngLatBounds();
   for(const p of target) bounds.extend([p.lon,p.lat]);
   map.fitBounds(bounds,{padding:35,maxZoom:13,duration:400});
 }
 window.pcasaSetPoints = (data) => {
   points = Array.isArray(data) ? data.filter(p=>
     Number.isFinite(p.lat)&&Number.isFinite(p.lon) &&
     Math.abs(p.lat)<=90 && Math.abs(p.lon)<=180) : [];
   // Coordinate corrections without an ID change must also recenter the
   // map. A stale camera used to hide an otherwise correctly loaded photo.
   const selectedSignature = points.filter(p=>p.selected)
     .map(p=>String(p.id)+':'+p.lat+':'+p.lon).sort().join(';');
   const selectionChanged = selectedSignature !== previousSelectedSignature;
   previousSelectedSignature = selectedSignature;
   if (ready) {
     updatePhotos();
     // A focus change keeps the map camera; a new set of GPS positions
     // establishes its own extent, even for exactly one selected image.
     if (selectionChanged && selectedSignature) zoomSelection();
   }
 };
 // A single huge ExecuteScriptAsync payload previously left stale map data
 // (often one focused photo) after large gallery selections. Only commit a
 // complete, matching transfer; never expose partial continents.
 function completePointTransfer() {
   if(!transferActive||!transferCommitRequested ||
      transferParts.filter(Array.isArray).length!==transferExpected)return;
   const assembled=transferParts.flat();
   const version=transferRevision;
   transferActive=false;transferParts=[];
   window.pcasaSetPoints(assembled);
   // Acknowledge the complete version, never a partial geographic overview.
   post({type:'gps-sync',version,received:points.length,
     selected:points.filter(p=>p.selected).length});
 }
 window.pcasaBeginPoints=(version,count)=>{
   if(!Number.isSafeInteger(version)||version<transferRevision ||
      !Number.isSafeInteger(count)||count<0)return;
   transferRevision=version;transferExpected=count;
   transferParts=new Array(count);transferCommitRequested=false;
   transferActive=true;
 };
 window.pcasaAppendPoints=(version,index,chunk)=>{
   if(!transferActive||version!==transferRevision ||
      !Number.isInteger(index)||index<0||index>=transferExpected ||
      !Array.isArray(chunk))return;
   transferParts[index]=chunk;
   completePointTransfer();
 };
 window.pcasaCommitPoints=(version)=>{
   if(!transferActive||version!==transferRevision)return;
   transferCommitRequested=true;
   completePointTransfer();
 };
 window.pcasaApplyProvider = (provider) => {
   if (!provider || !provider.url) return;
   try {
     const style=provider.format==='xyz'
       ? {version:8,sources:{basemap:{type:'raster',tiles:[provider.url],tileSize:256,attribution:provider.attribution||''}},
          layers:[{id:'basemap',type:'raster',source:'basemap'}]}
       : provider.url;
     map.setStyle(style);
   } catch(err) { post({type:'error',message:String(err)}); }
 };
 map.on('style.load',()=>{
   styleGeneration++;
   installPhotos();
   if(!ready){ready=true;post({type:'ready'});}
   // Style switching preserves the current camera instead of zooming again.
 });
 map.on('idle',()=>{
   if(!ready||transferActive)return;
   const selectedCount=points.filter(p=>p.selected).length;
   if(!selectedCount)return;
   const key=transferRevision+':'+styleGeneration+':'+Math.round(map.getZoom()*4);
   if(lastOverlayCheck===key)return;
   lastOverlayCheck=key;
   // The marker owner is DOM, so a GeoJSON source being loaded cannot
   // silently make all photo markers disappear after a basemap change.
   if(visibleSelectedGroups.length>0 && selectedMarkers.size===0)
     post({type:'gps-overlay-empty',version:transferRevision,
       selected:selectedCount,source:true,layers:0});
 });
 map.on('error',event=>{const s=String(event.error?.message||'');if(s)post({type:'error',message:s.substring(0,250)});});
 map.on('click','pcasa-clusters',event=>{
   const features=map.queryRenderedFeatures(event.point,{layers:['pcasa-clusters']});
   if(!features.length) return;
   const id=features[0].properties.cluster_id;
   map.getSource('pcasa-photos').getClusterExpansionZoom(id).then(
     zoom=>map.easeTo({center:features[0].geometry.coordinates,zoom})
   ).catch(()=>{});
 });
 function selectPhoto(event) {
   if(!event.features?.length) return;
   const id=Number(event.features[0].properties.id);
   if(Number.isSafeInteger(id)) post({type:'select',id});
 }
 map.on('click','pcasa-points',selectPhoto);
 map.on('mouseenter','pcasa-clusters',()=>map.getCanvas().style.cursor='pointer');
 map.on('mouseleave','pcasa-clusters',()=>map.getCanvas().style.cursor='');
 let draftMarker = null;
 let placementEnabled = false;
 function placeDraft(lat,lon,recenter) {
   if (!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return;
   if (!draftMarker) {
     const el=document.createElement('div');
     el.title='GPS-Position – ziehen, um sie zu korrigieren';
     el.style.cssText='width:21px;height:21px;background:#f8d573;border:3px solid #101010;outline:2px solid white;border-radius:2px;transform:rotate(45deg);box-sizing:border-box;cursor:move';
     draftMarker=new maplibregl.Marker({element:el,draggable:true,anchor:'center'})
       .setLngLat([lon,lat]).addTo(map);
     draftMarker.on('dragend',()=>{
       const p=draftMarker.getLngLat();
       post({type:'draft',lat:p.lat,lon:p.lng});
     });
   } else draftMarker.setLngLat([lon,lat]);
   if (recenter) map.easeTo({center:[lon,lat],zoom:Math.max(map.getZoom(),14),duration:450});
 }
 window.pcasaSetDraft = placeDraft;
 window.pcasaClearDraft = () => {
   placementEnabled = false;
   if (draftMarker) { draftMarker.remove(); draftMarker = null; }
   map.getCanvas().style.cursor = '';
 };
 window.pcasaEnablePlacement = enabled => {
   placementEnabled=!!enabled;
   map.getCanvas().style.cursor=placementEnabled ? 'crosshair' : '';
 };
 map.on('click',event=>{
   if (selectVisibleGroup(event)) return;
   if (!placementEnabled) return;
   const ids=['pcasa-points','pcasa-clusters']
     .filter(id=>!!map.getLayer(id));
   if (ids.length && map.queryRenderedFeatures(event.point,{layers:ids}).length) return;
   const lat=event.lngLat.lat,lon=event.lngLat.lng;
   placeDraft(lat,lon,false);
   post({type:'draft',lat,lon});
 });
 window.pcasaReadBounds = () => {
   const b=map.getBounds();
   post({type:'bounds',south:b.getSouth(),west:Math.max(-180,b.getWest()),
     north:b.getNorth(),east:Math.min(180,b.getEast())});
 };
 window.pcasaRestoreViewport = (lat,lon,zoom) => {
   if(Number.isFinite(lat)&&Number.isFinite(lon)&&Number.isFinite(zoom))
     map.jumpTo({center:[lon,lat],zoom});
 };
 map.on('moveend',()=>{
   drawSelected();
   const p=map.getCenter();
   post({type:'viewport',lat:p.lat,lon:p.lng,zoom:map.getZoom()});
 });
 window.pcasaResize = () => {map.resize();drawSelected();};
 map.on('load',()=>{fallback.remove();});
})();
</script></body></html>
