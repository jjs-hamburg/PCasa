name: Third-party license evidence (current source)
on:
  push:
    branches:
      - main
      - 'setup-*'
    paths:
      - '.github/workflows/license-inventory.yml'
      - '.github/scripts/audit-published-licenses.ps1'
      - 'tools/collect_third_party_licenses.ps1'
      - 'THIRD-PARTY-NOTICES.md'
      - 'LICENSES-*'
      - 'license-baseline/**'
      - 'src/PCasa.App/PCasa.App.csproj'
      - 'Directory.Packages.props'
      - 'tools/prepare-dynamic-libvips.ps1'
      - 'tools/audit-exiftool-perl-native.ps1'
      - 'Directory.Packages.props'
  pull_request:
    paths:
      - '.github/workflows/license-inventory.yml'
      - '.github/scripts/audit-published-licenses.ps1'
      - 'tools/collect_third_party_licenses.ps1'
      - 'THIRD-PARTY-NOTICES.md'
      - 'LICENSES-*'
      - 'docs/third-party-license-audit.md'
      - 'license-baseline/**'
      - 'src/PCasa.App/PCasa.App.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-evidence:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source commit, not obsolete Alpha.2
        uses: actions/checkout@v5
      - name: Check .NET 10 SDK
        shell: pwsh
        run: |
          if (-not (dotnet --list-sdks | Select-String '^10[.]')) {
            throw '.NET 10 SDK missing'
          }
      - name: Prepare pinned third-party assets
        shell: pwsh
        run: |
          ./.github/scripts/install-exiftool.ps1 -Destination "$env:GITHUB_WORKSPACE/tools/exiftool"
          ./.github/scripts/install-maplibre.ps1 -Destination "src/PCasa.App/Resources"
      - name: Publish exact Windows x64 software payload
        shell: pwsh
        run: |
          dotnet publish src/PCasa.App/PCasa.App.csproj --configuration Release --runtime win-x64 --self-contained false -p:DebugType=None -p:DebugSymbols=false -o publish/PCasa
          New-Item -ItemType Directory -Force -Path publish/PCasa/exiftool | Out-Null
          Copy-Item tools/exiftool/* publish/PCasa/exiftool -Recurse -Force
      - name: Install pinned dynamically linked libvips into actual PCasa publish
        shell: pwsh
        run: |
          ./tools/prepare-dynamic-libvips.ps1 -PublishDir publish/PCasa -EvidenceDir license-audit/dynamic-libvips
          $actual = (Get-FileHash -LiteralPath publish/PCasa/libvips-42.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '4d3a83e136eb6f63fa8f4062e8343f87bfdc65afaab2eb30175d9ac844b88555') {
            throw 'Old static native DLL remains in published PCasa'
          }
      - name: Export complete credits from bundled Chromium/CEF
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --chromium-credits "publish/PCasa/Licenses/Chromium-Credits.html"
          if ((Get-Item "publish/PCasa/Licenses/Chromium-Credits.html").Length -lt 50000) { throw "Chromium third-party credits missing" }
      - name: Collect licensing materials and fail on missing essentials
        shell: pwsh
        run: |
          ./tools/collect_third_party_licenses.ps1 -AssetsFile src/PCasa.App/obj/project.assets.json -PublishDir publish/PCasa
      - name: Map all executable Perl and Strawberry native components to original rights evidence
        shell: pwsh
        run: |
          ./tools/audit-exiftool-perl-native.ps1 -PublishDir publish/PCasa -OutputDir license-audit
      - name: Produce hashes, complete NuGet inventory and review findings
        shell: pwsh
        run: |
          ./.github/scripts/audit-published-licenses.ps1 -PublishDir publish/PCasa -ProjectAssetsFile src/PCasa.App/obj/project.assets.json -OutputDir license-audit
          Copy-Item docs/third-party-license-audit.md license-audit/review-status.md
          Copy-Item THIRD-PARTY-NOTICES.md license-audit/THIRD-PARTY-NOTICES.md
          Copy-Item publish/PCasa/Licenses/NuGet-license-inventory.csv license-audit/installed-nuget-license-inventory.csv
          if (-not (Test-Path license-audit/publish-files.csv)) { throw 'No binary file inventory' }
          if (-not (Test-Path license-audit/nuget-dependency-licenses.csv)) { throw 'No dependency inventory' }
      - name: Verify native PCasa image operations from the actual publish folder
        shell: pwsh
        run: |
          dotnet new console --framework net10.0 -o native-probe
          dotnet add native-probe package NetVips --version 3.2.0
          @'
          using NetVips;
          using var image = Image.Black(4, 4);
          using var enlarged = image.Resize(2);
          if (enlarged.Width != 8 || enlarged.Height != 8) throw new Exception("Native resize failed");
          Console.WriteLine("PASS: installed native libvips in published PCasa folder");
          '@ | Set-Content native-probe/Program.cs
          dotnet publish native-probe/native-probe.csproj --configuration Release --runtime win-x64 --self-contained false -o native-probe-out
          Copy-Item native-probe-out/native-probe.* publish/PCasa -Force
          & ./publish/PCasa/native-probe.exe
          if ($LASTEXITCODE -ne 0) { throw "PCasa native image operation failed: $LASTEXITCODE" }
          Remove-Item publish/PCasa/native-probe.* -Force
      - name: Compile real Windows installer using tested dynamic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler not installed' }
          & $iscc installer/PCasa.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path dist/PCasa-Setup-0.1.Alpha.8.exe)) { throw 'No built installer' }
      - name: Install built installer and verify actual dynamic DLLs and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'pcasa-license-setup-check'
          $p = Start-Process -FilePath (Resolve-Path dist/PCasa-Setup-0.1.Alpha.8.exe).Path -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dest") -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "Installer exited $($p.ExitCode)" }
          $manifest = Import-Csv license-audit/dynamic-libvips/native-dll-inventory.csv
          foreach ($dll in $manifest) {
            $path = Join-Path $dest $dll.File
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installed dynamic DLL: $($dll.File)" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $dll.SHA256.ToLowerInvariant()) { throw "Incorrect installed DLL: $($dll.File)" }
          }
          foreach ($rel in @('Licenses/Native/libvips-8.18.7/README.md','Licenses/Native/exiftool-13.59/README.md','exiftool/exiftool_files/Licenses_Strawberry_Perl.zip')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dest $rel))) { throw "Missing installed license material: $rel" }
          }
          $static = '06dab07cc386748513337a31672b1d5269fbc770a14ff403080575665bf0813f'
          $actual = (Get-FileHash -LiteralPath (Join-Path $dest 'libvips-42.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -eq $static) { throw 'Old static libvips shipped in actual installer' }
          Write-Host "PASS: real Windows installer contains $($manifest.Count) dynamic DLLs, exact hashes and original license texts"
      - name: Upload evidence - NOT a legal clearance certificate
        uses: actions/upload-artifact@v4
        with:
          name: PCasa-license-evidence-${{ github.sha }}
          path: license-audit/
          if-no-files-found: error
          retention-days: 7
