name: Scheduler Consistency Tests

# Main is the reviewed, stable development baseline. Setup feature branches
# run the same full Windows acceptance tests before their changes reach main.
# Manual acceptance remains available without pushing new source commits.
on:
  push:
    branches:
      - main
      - 'setup-*'
      - ui-crop-live-alpha14
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every source commit on main or a setup branch supersedes its predecessor.
# Test/build only the newest push, avoiding parallel 270 MB ZIP artifacts
# and conserving the account's limited GitHub Actions storage.
# Manually dispatched acceptance builds remain independent.
concurrency:
  group: pcasa-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Use the same verified metadata tool for catalog AND all real-WPF runs.
env:
  PCASA_EXIFTOOL_PATH: ${{ github.workspace }}/tools/exiftool/exiftool.exe

jobs:
  catalog-regressions:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
      # Prefer the .NET 10 SDK already present on windows-latest. The
      # setup-dotnet CDN currently returns HTTP 409 for both LTS runtime
      # and SDK downloads; use it only if the runner lacks a 10.x SDK.
      - name: Validate PCasa release version parser and next-version scenarios
        shell: pwsh
        run: ./tools/Test-PCasaReleaseVersion.ps1
      - name: Check installed .NET 10 SDK
        id: installed-dotnet
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $has10 = @($sdks | Where-Object { $_ -match '^10\.' }).Count -gt 0
          Write-Host ($sdks -join "`n")
          "has10=$($has10.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Setup .NET 10 if absent
        if: steps.installed-dotnet.outputs.has10 != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate PCasa Windows icon for EXE and installer
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/generate_pcasa_icon.py
          if (-not (Test-Path "src/PCasa.App/Assets/PCasa.ico")) { throw "PCasa icon missing" }
      - name: Install verified lossless metadata tool
        shell: pwsh
        run: ./.github/scripts/install-exiftool.ps1 -Destination "$env:GITHUB_WORKSPACE/tools/exiftool"
      - name: Bundle pinned MapLibre JS and CSS into PCasa.App.dll
        shell: pwsh
        run: ./.github/scripts/install-maplibre.ps1 -Destination "src/PCasa.App/Resources"
      # The former static NetVips NuGet package supplied native DLLs to
      # test runners implicitly. Dynamic libvips must be present BEFORE
      # thumbnail/catalog and WPF tests, not only after dotnet publish.
      - name: Supply pinned dynamic libvips for catalog and WPF regression tests
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:RUNNER_TEMP 'pcasa-native-regression'
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          ./tools/prepare-dynamic-libvips.ps1 -PublishDir $nativeDir -EvidenceDir license-audit/test-native
          $nativeDir >> $env:GITHUB_PATH
      - name: Verify selected GPS overlay at 6,000 photos and across continents
        shell: pwsh
        run: node tests/gps-map-overlay.test.cjs
      - name: Verify startup gallery rendering beside blocked durable P0
        shell: pwsh
        timeout-minutes: 2
        run: |
          dotnet run --project tests/PCasa.CatalogTests/PCasa.CatalogTests.csproj --configuration Release -- --startup-browse-probe
      - name: Exercise real WPF gallery copy and move on monitored folders
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --gallery-files
      - name: Test real MTA JPEG crop, central Undo and preserved photo metadata
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --crop-flow
      - name: Verify taskmanager durable ordering, retry and safe cancellation
        timeout-minutes: 2
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --taskmanager

      - name: Run WPF window smoke tests
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release
      - name: Probe EXIF reader, GPS fields and legacy backfill
        env:
          PCASA_EXIFTOOL_PATH: ${{ github.workspace }}/tools/exiftool/exiftool.exe
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.CatalogTests/PCasa.CatalogTests.csproj --configuration Release -- --exif-probe
      - name: Verify persistent ExifTool tag-writing protocol
        timeout-minutes: 2
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.CatalogTests/PCasa.CatalogTests.csproj --configuration Release -- --tag-write-probe
      - name: Verify durable GPS/tag package pause, restart and cursor recovery
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/PCasa.CatalogTests/PCasa.CatalogTests.csproj --configuration Release -- --durable-pause-probe
      - name: Run catalog regression executable
        env:
          PCASA_EXIFTOOL_PATH: ${{ github.workspace }}/tools/exiftool/exiftool.exe
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.CatalogTests/PCasa.CatalogTests.csproj --configuration Release
      - name: Exercise real WPF context-menu folder removal under active cache lock
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --folder-removal
      - name: Exercise real WPF priority folder add and restart
        timeout-minutes: 4
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --folder-add
      - name: Exercise real WPF tag search and folder-anchor round trip
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --tag-flow
      - name: Verify global task ordering across P0, P4, GPS recipe admission and WPF buttons
        timeout-minutes: 2
        shell: pwsh
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --taskmanager-global

      - name: Publish framework-dependent Windows x64 acceptance package
        shell: pwsh
        run: |
          dotnet publish src/PCasa.App/PCasa.App.csproj --configuration Release --runtime win-x64 --self-contained false -p:DebugType=None -p:DebugSymbols=false -o publish/PCasa
          # Default textures are installed in writable PCasa DATA, not Program Files.
          $sourceTextures = @(Get-ChildItem "default-textures" -File |
              Where-Object { $_.Extension -in @(".jpg", ".jpeg") })
          if ($sourceTextures.Count -ne 12) {
            throw "Expected exactly twelve supplied JPG textures"
          }
          if (Test-Path -LiteralPath "publish/PCasa/Texturen") {
            throw "Published executable folder must not contain user-editable textures"
          }
          New-Item -ItemType Directory -Force -Path "publish/PCasa/exiftool" | Out-Null
          Copy-Item -Path "tools/exiftool/*" -Destination "publish/PCasa/exiftool" -Recurse -Force
          Copy-Item -Path "tools/PCasa-JPEG-Benchmark.cmd" -Destination "publish/PCasa/PCasa-JPEG-Benchmark.cmd" -Force
          # Strict runtime separation: installer must NOT ship Microsoft shared
          # WPF/.NET runtime files; their installer belongs to Microsoft.
          if (Test-Path "publish/PCasa/hostfxr.dll") {
            throw "Framework-dependent PCasa accidentally bundled .NET hostfxr.dll"
          }
          if (Test-Path "publish/PCasa/PresentationFramework.dll") {
            throw "Framework-dependent PCasa accidentally bundled the WPF runtime"
          }
          if (Test-Path "publish/PCasa/coreclr.dll") {
            throw "Framework-dependent PCasa accidentally bundled CoreCLR"
          }
          $runtimeConfig = Get-Content "publish/PCasa/PCasa.App.runtimeconfig.json" -Raw
          if ($runtimeConfig -notmatch "Microsoft.WindowsDesktop.App") {
            throw "PCasa missing shared Windows Desktop Runtime framework reference"
          }
          if (-not (Test-Path "publish/PCasa/PCasa.App.exe")) { throw "Windows build missing" }
          if (-not (Test-Path "publish/PCasa/exiftool/exiftool.exe")) { throw "Metadata tool missing" }
          if (-not (Test-Path "publish/PCasa/PCasa-JPEG-Benchmark.cmd")) { throw "JPEG benchmark launcher missing" }
          $dll = "publish/PCasa/PCasa.App.dll"
          $dllHash = (Get-FileHash -Path $dll -Algorithm SHA256).Hash
          # Read the product identity from the published executable, never
          # invent a separate CI-only version or replace it with the SHA.
          $exeVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path "publish/PCasa/PCasa.App.exe").Path)
          $appVersion = $exeVersion.ProductVersion
          $windowsFileVersion = $exeVersion.FileVersion
          $releaseVersion = ./tools/Get-PCasaReleaseVersion.ps1
          if ($appVersion -ne $releaseVersion.Product -or $windowsFileVersion -ne $releaseVersion.File) {
            throw "Published version mismatch: $appVersion / $windowsFileVersion"
          }
          @(
            "Version=$appVersion"
            "WindowsFileVersion=$windowsFileVersion"
            "Commit=$env:GITHUB_SHA"
            "WorkflowRun=$env:GITHUB_RUN_ID"
            "PCasa.App.dll.SHA256=$dllHash"
          ) | Set-Content -Path "publish/PCasa/BUILD-INFO.txt" -Encoding UTF8
          Write-Host "Build identity: commit=$env:GITHUB_SHA DLL SHA256=$dllHash"
          Write-Host "Verified twelve source textures; Inno Setup installs them into PCasa data root"
      - name: Supply hash-pinned dynamic libvips DLLs for actual release
        shell: pwsh
        run: ./tools/prepare-dynamic-libvips.ps1 -PublishDir publish/PCasa -EvidenceDir license-audit/dynamic-libvips
      - name: Export exact Chromium/CEF third-party credits for offline installation
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/PCasa.WindowSmokeTests/PCasa.WindowSmokeTests.csproj --configuration Release -- --chromium-credits "publish/PCasa/Licenses/Chromium-Credits.html"
          if ((Get-Item "publish/PCasa/Licenses/Chromium-Credits.html").Length -lt 50000) { throw "Chromium credits missing from installer payload" }
      - name: Collect and verify bundled third-party license files
        shell: pwsh
        run: |
          ./tools/collect_third_party_licenses.ps1 -AssetsFile "src/PCasa.App/obj/project.assets.json" -PublishDir "publish/PCasa"
          foreach ($required in @(
            "Licenses/PCasa-GPL-3.0.txt",
            "Licenses/THIRD-PARTY-NOTICES.md",
            "Licenses/NuGet-license-inventory.csv",
            "Licenses/MapLibre-LICENSE.txt"
          )) {
            if (-not (Test-Path (Join-Path "publish/PCasa" $required))) {
              throw "License packaging gate failed: $required"
            }
          }
      - name: Audit actual published licensing evidence before installer or release
        shell: pwsh
        run: |
          ./tools/audit-exiftool-perl-native.ps1 -PublishDir publish/PCasa -OutputDir license-audit
          ./.github/scripts/audit-published-licenses.ps1 -PublishDir publish/PCasa -ProjectAssetsFile src/PCasa.App/obj/project.assets.json -OutputDir license-audit
          if (-not (Test-Path license-audit/component-evidence.csv)) { throw 'Missing component evidence' }
      - name: Verify .NET 10 Desktop Runtime prerequisite detection
        shell: pwsh
        run: |
          # Real runner: runtime detected without installing or changing Windows.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer/Check-DesktopRuntime.ps1" -ProbeOnly
          if ($LASTEXITCODE -ne 0) { throw "Installed x64 Desktop Runtime not detected" }
          # Isolated empty root: negative case must never initiate download or
          # elevation. Simulates a machine lacking .NET.
          $missing = Join-Path $env:RUNNER_TEMP "pcasa-no-desktop-runtime"
          New-Item -ItemType Directory -Force -Path $missing | Out-Null
          $probe = Start-Process -FilePath "powershell.exe" -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", "installer/Check-DesktopRuntime.ps1",
            "-ProbeOnly", "-RuntimeRoot", $missing) -Wait -PassThru
          if ($probe.ExitCode -ne 10) { throw "Missing x64 Desktop Runtime not rejected ($($probe.ExitCode))" }
      - name: Verify official Microsoft runtime download without installing
        shell: pwsh
        timeout-minutes: 10
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer/Check-DesktopRuntime.ps1" -VerifyInstallerOnly
          if ($LASTEXITCODE -ne 0) { throw "Official Desktop Runtime download, SHA512 or Microsoft signature verification failed" }
      - name: Build dual-scope PCasa Setup executable
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not installed" }
          ./tools/Build-PCasaInstaller.ps1 -IsccPath $iscc
          if ($LASTEXITCODE -ne 0) { throw "PCasa setup compilation failed" }
          $releaseVersion = ./tools/Get-PCasaReleaseVersion.ps1
          if (-not (Test-Path -LiteralPath $releaseVersion.InstallerPath)) {
            throw "Setup executable missing"
          }
      - name: Smoke-test both Windows installer modes
        shell: pwsh
        run: |
          $releaseVersion = ./tools/Get-PCasaReleaseVersion.ps1
          $installer = (Resolve-Path -LiteralPath $releaseVersion.InstallerPath).Path
          $sourceTextures = @(Get-ChildItem "default-textures" -File |
            Where-Object { $_.Extension -in @(".jpg", ".jpeg") })
          foreach ($mode in @("CURRENTUSER", "ALLUSERS")) {
            $scope = $mode.ToLowerInvariant()
            $target = Join-Path $env:RUNNER_TEMP "pcasa-probe-$scope"
            $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
                      "/PCASASCOPE=$mode", "/DIR=$target")
            $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Setup $mode failed (exit code $($process.ExitCode))"
            }
            if (-not (Test-Path (Join-Path $target "PCasa.App.exe"))) {
              throw "Setup $mode did not install PCasa.App.exe"
            }
            # License checks must inspect the ACTUAL installed files in
            # BOTH setup scopes, not only the intermediate publish folder.
            foreach ($requiredLicense in @(
              "Licenses/PCasa-GPL-3.0.txt",
              "Licenses/THIRD-PARTY-NOTICES.md",
              "Licenses/NuGet-license-inventory.csv",
              "Licenses/MapLibre-LICENSE.txt",
              "Licenses/CEF-LIBVIPS-GUIDE.txt",
              "Licenses/NATIVE-BUILD-VERSIONS.txt",
              "Licenses/Chromium-Credits.html",
              "Licenses/LGPL-3.0.txt",
              "Licenses/MPL-1.1.txt",
              "Licenses/Apache-2.0.txt",
              "Licenses/MIT-Microsoft.txt",
              "Licenses/MIT-NetVips.txt",
              "exiftool/exiftool_files/LICENSE",
              "exiftool/exiftool_files/Licenses_Strawberry_Perl.zip"
            )) {
              $licensePath = Join-Path $target $requiredLicense
              if (-not (Test-Path $licensePath -PathType Leaf) -or
                  (Get-Item $licensePath).Length -eq 0) {
                throw "Setup $mode missing license document: $requiredLicense"
              }
            }
            $packageLicenses = Join-Path $target "Licenses/Packages"
            if (-not (Test-Path $packageLicenses -PathType Container) -or
                @(Get-ChildItem $packageLicenses -File -Recurse).Count -eq 0) {
              throw "Setup $mode missing transitive package license material"
            }
            # Verify the exact release payload, including all dynamic native
            # libraries and the complete official ExifTool/Perl bundle, for
            # both Windows installation modes before publishing a release.
            $sourceRoot = (Resolve-Path "publish/PCasa").Path
            $sourceFiles = @(Get-ChildItem -LiteralPath $sourceRoot -File -Recurse)
            foreach ($source in $sourceFiles) {
              $relative = [IO.Path]::GetRelativePath($sourceRoot,$source.FullName)
              $installed = Join-Path $target $relative
              if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
                throw "Setup $mode missing source payload file: $relative"
              }
              $expected = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
              if ($expected -ne $actual) { throw "Setup $mode changed payload file: $relative" }
            }
            Write-Host "PASS: setup $mode preserves $($sourceFiles.Count) publish files byte-for-byte"
            $marker = Test-Path (Join-Path $target "PCasa.all-users")
            if ($marker -ne ($mode -eq "ALLUSERS")) {
              throw "Setup $mode selected the wrong catalog data scope"
            }
            $dataRoot = if ($mode -eq "ALLUSERS") {
              Join-Path $env:ProgramData "PCasa"
            } else {
              Join-Path $env:LOCALAPPDATA "PCasa"
            }
            foreach ($folder in @("GPX","Undo","Texturen")) {
              if (-not (Test-Path -LiteralPath (Join-Path $dataRoot $folder) -PathType Container)) {
                throw "Setup $mode missing $folder data folder"
              }
            }
            foreach ($texture in $sourceTextures) {
              $installedTexture = Join-Path (Join-Path $dataRoot "Texturen") $texture.Name
              if (-not (Test-Path -LiteralPath $installedTexture) -or
                  (Get-FileHash -LiteralPath $texture.FullName -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath $installedTexture -Algorithm SHA256).Hash) {
                throw "Setup $mode missing or changed texture $($texture.Name)"
              }
            }
            # Simulate an installed legacy default texture. Upgrades must remove
            # retired bundled files without deleting user-supplied textures.
            New-Item -ItemType Directory -Path (Join-Path $target "Texturen") -Force | Out-Null
            $retiredTexture = Join-Path $target "Texturen/Leinwand hell.jpg"
            $customTexture = Join-Path $target "Texturen/My Custom Texture.jpg"
            Set-Content -LiteralPath $retiredTexture -Value "legacy shipped texture"
            Set-Content -LiteralPath $customTexture -Value "user-owned texture"
            # Simulate an older self-contained PCasa installation in-place:
            # the upgrade must remove old Microsoft WPF/.NET DLLs while
            # preserving the application and its packaged dependencies.
            foreach ($legacy in @("hostfxr.dll", "coreclr.dll",
                "PresentationFramework.dll", "System.Private.CoreLib.dll")) {
              Set-Content -Path (Join-Path $target $legacy) -Value "legacy-runtime"
            }
            $upgrade = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) {
              throw "Setup $mode in-place upgrade failed (exit code $($upgrade.ExitCode))"
            }
            foreach ($legacy in @("hostfxr.dll", "coreclr.dll",
                "PresentationFramework.dll", "System.Private.CoreLib.dll")) {
              if (Test-Path (Join-Path $target $legacy)) {
                throw "Setup $mode failed to remove legacy self-contained $legacy"
              }
            }
            if (Test-Path -LiteralPath $retiredTexture) {
              throw "Setup $mode left retired bundled Leinwand texture installed"
            }
            if (-not (Test-Path -LiteralPath $customTexture)) {
              throw "Setup $mode deleted a user-supplied texture"
            }
            if (-not (Test-Path (Join-Path $target "Microsoft.Data.Sqlite.dll"))) {
              throw "Setup $mode lost application dependencies during runtime cleanup"
            }
            $uninstaller = Join-Path $target "unins000.exe"
            if (-not (Test-Path $uninstaller)) {
              throw "Setup $mode did not install an uninstaller"
            }
            # Silent uninstallation must preserve user data by default.
            $personalRoot = Join-Path $env:LOCALAPPDATA "PCasa"
            New-Item -ItemType Directory -Path $personalRoot -Force | Out-Null
            $personalProbe = Join-Path $personalRoot "pcasa-test-uninstall-retain.txt"
            Set-Content -Path $personalProbe -Value "retain"
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($remove.ExitCode -ne 0) {
              throw "Uninstall $mode failed (exit code $($remove.ExitCode))"
            }
            if (-not (Test-Path $personalProbe)) {
              throw "Silent uninstall $mode deleted personal data without explicit consent"
            }
            # Opt-in removal is tested separately, without reusing any
            # real user data: GitHub runners are disposable isolated VMs.
            $reinstall = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($reinstall.ExitCode -ne 0) { throw "Reinstall $mode failed" }
            $sharedRoot = Join-Path $env:ProgramData "PCasa"
            if ($mode -eq "ALLUSERS") {
              New-Item -ItemType Directory -Path $sharedRoot -Force | Out-Null
              Set-Content -Path (Join-Path $sharedRoot "pcasa-test-uninstall-purge.txt") -Value "purge"
            }
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PCASAPURGEDATA") -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Opt-in purge $mode failed" }
            if (Test-Path $personalRoot) {
              throw "Opt-in purge $mode left the PCasa personal data folder"
            }
            if ($mode -eq "ALLUSERS" -and (Test-Path $sharedRoot)) {
              throw "Opt-in purge $mode left the shared PCasa catalog"
            }
            Write-Host "PASS: $mode install, update, silent retain, opt-in complete purge"
          }
      # Actions artifacts are always ZIP files. Publish only the directly
      # downloadable EXE as a GitHub prerelease after all Windows tests pass.
      - name: Publish direct PCasa Setup EXE (no Actions ZIP)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $releaseVersion = ./tools/Get-PCasaReleaseVersion.ps1
          $release = $releaseVersion.Tag
          $installer = $releaseVersion.InstallerPath
          if (-not (Test-Path $installer)) { throw "Tested installer is missing" }
          gh release view $release 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $release already exists; preserving its immutable tested installer"; exit 0 }
          gh release create $release $installer --target $env:GITHUB_SHA --title "PCasa $($releaseVersion.Product)" --prerelease --notes "Windows x64 Setup for PCasa $($releaseVersion.Product). Includes hash-verified native dependencies and installed third-party license documentation. Both installer scopes are validated before publication."
          if ($LASTEXITCODE -ne 0) { throw "Direct executable release failed" }
