name: Build Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer PR commit supersedes older Windows build checks.
# Keep manually started runs independent.
concurrency:
  group: pcasa-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/PCasa.App/PCasa.App.csproj

      - name: Build
        run: dotnet build src/PCasa.App/PCasa.App.csproj --configuration Release --no-restore
