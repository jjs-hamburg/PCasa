name: Native libvips linkage comparison

on:
  push:
    branches:
      - 'setup-native-license-*'
    paths:
      - '.github/workflows/native-linkage-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download exact upstream 8.18.7 binary variants and inspect PE imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet pefile
          New-Item -ItemType Directory -Force native-evidence | Out-Null
          $variants = @(
            @{ Name = 'static'; Url = 'https://github.com/libvips/build-win64-mxe/releases/download/v8.18.7/vips-dev-x64-web-8.18.7-static.zip'; Expected = 'a736af61d3b46499760efa606e469cb14e060445b1f6fd36a1fa2e75009e1197' },
            @{ Name = 'dynamic'; Url = 'https://github.com/libvips/build-win64-mxe/releases/download/v8.18.7/vips-dev-x64-web-8.18.7.zip'; Expected = '3a122eb3d588690008216f786338e2f9329dba3c3c2768b5933cf7299d549241' }
          )
          foreach ($variant in $variants) {
            $archive = "native-evidence/$($variant.Name).zip"
            Invoke-WebRequest -Uri $variant.Url -OutFile $archive -MaximumRedirection 10
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $variant.Expected) {
              throw "$($variant.Name) upstream asset digest mismatch: $hash"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath "native-evidence/$($variant.Name)" -Force
            Remove-Item -LiteralPath $archive
          }
          python .github/scripts/inspect-vips-variants.py native-evidence
          if (-not (Test-Path native-evidence/comparison.csv)) { throw 'No comparison created' }
          Get-Content native-evidence/summary.md
      - name: Save verifiable dependency comparison (no change to PCasa runtime)
        uses: actions/upload-artifact@v4
        with:
          name: libvips-8.18.7-native-import-comparison
          path: |
            native-evidence/comparison.csv
            native-evidence/summary.md
          retention-days: 7
          if-no-files-found: error
