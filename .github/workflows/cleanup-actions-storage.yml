name: One-off PCasa artifact cleanup

# Run only for this maintenance-branch commit. No build/package job.
on:
  push:
    branches:
      - maintenance/cleanup-actions-20261101
    paths:
      - .github/workflows/cleanup-actions-storage.yml

permissions:
  contents: read
  actions: write

jobs:
  delete-obsolete-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Remove outdated Actions artifacts, preserve successful build 969
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const protectedId = 13088546015; // PCasa-win-x64, successful #969
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100}
            );
            const keep = artifacts.find(a =>
              a.id === protectedId &&
              a.name === 'PCasa-win-x64' &&
              !a.expired
            );
            if (!keep) {
              core.setFailed('Protected successful build #969 is missing. Refusing cleanup.');
              return;
            }
            const obsolete = artifacts.filter(a =>
              a.id !== protectedId &&
              Date.parse(a.created_at) <= Date.parse(keep.created_at)
            );
            const totalBytes = obsolete.reduce((sum,a) => sum + a.size_in_bytes, 0);
            core.info(`Protected: ${keep.id} (${keep.name}, ${keep.size_in_bytes} bytes)`);
            core.info(`Found ${artifacts.length} artifacts; ${obsolete.length} obsolete (${(totalBytes / 1073741824).toFixed(2)} GiB).`);
            let removed = 0, freed = 0, failures = [];
            for (const a of obsolete) {
              let ok = false;
              for (let attempt = 1; attempt <= 4 && !ok; attempt++) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner, repo, artifact_id: a.id
                  });
                  removed += 1;
                  freed += a.size_in_bytes;
                  ok = true;
                  core.info(`Deleted ${a.id}: ${a.name} (${a.size_in_bytes} bytes)`);
                } catch (e) {
                  if (e.status === 404) {
                    core.info(`Already absent: ${a.id}`);
                    ok = true;
                    break;
                  }
                  if (attempt < 4 && [403, 429, 500, 502, 503].includes(e.status)) {
                    await new Promise(resolve => setTimeout(resolve, attempt * 3000));
                  } else {
                    failures.push(`${a.id}: ${e.message}`);
                    core.warning(`Could not delete ${a.id}: ${e.message}`);
                    break;
                  }
                }
              }
              await new Promise(resolve => setTimeout(resolve, 200));
            }
            core.summary.addHeading('PCasa Actions artifact cleanup')
              .addTable([
                [{data:'Result',header:true},{data:'Value',header:true}],
                ['Retained', `PCasa-win-x64, build #969 (artifact ${protectedId})`],
                ['Old artifacts removed', String(removed)],
                ['Estimated artifact bytes freed', `${(freed / 1073741824).toFixed(2)} GiB`],
                ['Deletion errors', String(failures.length)]
              ]);
            await core.summary.write();
            core.info(`DONE: removed ${removed} artifacts, freed ${freed} bytes; failures=${failures.length}`);
            if (failures.length > 0) {
              core.setFailed(`${failures.length} artifact deletion(s) failed.`);
            }
