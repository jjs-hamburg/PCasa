name: Portable Core Tests

on:
  push:
    branches:
      - main
      - alpha63-architecture
  pull_request:
  workflow_dispatch:

concurrency:
  group: portable-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test portable core
        run: dotnet run --project tests/PCasa.CoreTests/PCasa.CoreTests.csproj --configuration Release
      - name: Install native imaging dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libimage-exiftool-perl
          pkg-config --modversion vips
          exiftool -ver
      - name: Install native imaging dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vips exiftool
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vips)/lib:$(brew --prefix)/lib" >> "$GITHUB_ENV"
          pkg-config --modversion vips
          exiftool -ver
      - name: Test real native decoding and metadata
        run: dotnet run --project tests/PCasa.CoreTests/PCasa.CoreTests.csproj --configuration Release -- --native-imaging
